name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow with all site URLs
        run: |
          sleep 20
          curl -s https://tarocik.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "Submitting $COUNT URLs to IndexNow"
          node -e "
            const fs = require('fs');
            const urls = fs.readFileSync('urls.txt', 'utf8').trim().split('\n');
            fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({
                host: 'tarocik.com',
                key: '9454241dbd15bae0b4ebd450c91b0c95',
                keyLocation: 'https://tarocik.com/9454241dbd15bae0b4ebd450c91b0c95.txt',
                urlList: urls,
              }),
            }).then((r) => { console.log('IndexNow response:', r.status); if (r.status >= 400) process.exit(1); });
          "
